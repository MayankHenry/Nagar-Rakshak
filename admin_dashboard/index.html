<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagar Rakshak - Admin Command Center</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
        h1 { color: #d35400; text-align: center; margin-bottom: 30px; }
        
        /* Grid Layout for Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        /* Individual Report Card */
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
        
        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; margin-top: 12px; text-transform: uppercase; }
        .high { background-color: #e74c3c; } /* Red */
        .medium { background-color: #f39c12; } /* Orange */
        .low { background-color: #27ae60; } /* Green */
        .none { background-color: #95a5a6; } /* Grey */

        .status { font-weight: bold; margin-top: 10px; display: block; }
        .pending { color: #d35400; }
        .fixed { color: #27ae60; }

        button { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #219150; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>🏛️ Nagar Rakshak Command Center</h1>
    <div id="reports-container" class="grid">
        <h2 style="text-align:center; width:100%;">Loading Reports...</h2>
    </div>

    <script>
        // 2. YOUR CONFIGURATION (I pasted your keys here for you)
        const firebaseConfig = {
            apiKey: "AIzaSyAZOKjVk0eZACVx8cefiRvNn9Qkhjk9jW4",
            authDomain: "nagarrakshak-2026.firebaseapp.com",
            projectId: "nagarrakshak-2026",
            storageBucket: "nagarrakshak-2026.firebasestorage.app",
            messagingSenderId: "208326011200",
            appId: "1:208326011200:web:a3d0edc9457b3b6a63f2a5",
            measurementId: "G-HVYTYXST7Y"
        };

        // 3. Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 4. Fetch & Display Reports
        const container = document.getElementById('reports-container');

        // This listens for updates in Real-Time!
        db.collection("reports").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            container.innerHTML = ""; // Clear the loading text
            
            if(snapshot.empty) {
                container.innerHTML = "<h3 style='text-align:center; width:100%'>No reports found. Great job! ✅</h3>";
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                
                // Convert Base64 Text back to Image
                const imgSrc = `data:image/jpeg;base64,${data.imageBase64}`;

                // Determine Button State
                const isFixed = data.status === 'fixed';
                const btnText = isFixed ? "Issue Resolved 🎉" : "✅ Mark as Fixed";
                const btnState = isFixed ? "disabled" : "";

                // Create Card HTML
                const card = `
                    <div class="card">
                        <img src="${imgSrc}" alt="Issue Photo">
                        <h3>${data.issue ? data.issue.toUpperCase() : 'UNKNOWN ISSUE'}</h3>
                        <span class="badge ${data.severity}">${data.severity ? data.severity.toUpperCase() : 'NORMAL'} PRIORITY</span>
                        
                        <p class="status ${data.status}">Status: ${data.status.toUpperCase()}</p>
                        <p style="color:gray; font-size:0.9em">
                            📅 ${data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString() : 'Just now'}
                        </p>
                        
                        <button ${btnState} onclick="markFixed('${id}')">${btnText}</button>
                    </div>
                `;
                container.innerHTML += card;
            });
        });

        // 5. Function to Resolve Issues
        window.markFixed = function(id) {
            if(confirm("Are you sure this issue is resolved?")) {
                db.collection("reports").doc(id).update({
                    status: "fixed"
                });
            }
        }
    </script>

</body>
</html>
